<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose Spawn</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; color: #f4f4f5; font-family: Arial, sans-serif; }
    body { display: none; }
    body.visible { display: block; }
    #panel { position: absolute; top: 9vh; left: 4vw; width: min(390px, 90vw); max-height: 82vh; overflow-y: auto; padding: 22px; border-radius: 12px; background: rgba(18,20,25,.96); border: 1px solid rgba(255,255,255,.15); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
    h1 { margin: 0 0 16px; font-size: 19px; letter-spacing: 1px; text-align: center; }
    #locations { display: flex; flex-direction: column; gap: 9px; }
    button { width: 100%; padding: 13px 14px; border: 1px solid #454955; border-radius: 7px; background: #292d36; color: #fff; font-size: 14px; text-align: left; cursor: pointer; }
    button:hover, button.selected { background: #b83232; border-color: #e35d5d; }
    #confirm { margin-top: 15px; text-align: center; background: #267a50; border-color: #359767; font-weight: bold; }
    #confirm:disabled { opacity: .45; cursor: not-allowed; }
    #message { display: none; margin-top: 12px; color: #ffc6c6; font-size: 13px; }
  </style>
</head>
<body>
  <main id="panel" role="dialog" aria-label="Choose spawn location">
    <h1 id="heading">WHERE WOULD YOU LIKE TO START?</h1>
    <div id="locations"></div>
    <button id="confirm" disabled>CONFIRM LOCATION</button>
    <div id="message"></div>
  </main>
  <script>
    (() => {
      const locationsEl = document.getElementById('locations');
      const confirmEl = document.getElementById('confirm');
      const messageEl = document.getElementById('message');
      let selected = null;
      let isNew = false;

      function post(name, data = {}) {
        return fetch('https://qb-spawn/' + name, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=UTF-8' },
          body: JSON.stringify(data)
        }).catch(err => {
          messageEl.textContent = 'Could not contact spawn resource. Check F8 for errors.';
          messageEl.style.display = 'block';
          console.error('[qb-spawn] NUI callback failed:', name, err);
        });
      }

      function addButton(label, type, name, camType) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label || String(name || 'Spawn');
        button.addEventListener('click', () => {
          selected = { type, name };
          confirmEl.disabled = false;
          [...locationsEl.querySelectorAll('button')].forEach(b => b.classList.remove('selected'));
          button.classList.add('selected');
          if (camType) post('setCam', { posname: name, type: camType });
        });
        locationsEl.appendChild(button);
      }

      function renderLocations(data) {
        locationsEl.replaceChildren();
        selected = null;
        confirmEl.disabled = true;
        messageEl.style.display = 'none';
        if (!isNew) addButton('Last Location', 'current', 'current', 'current');

        const normal = Array.isArray(data.locations) ? data.locations : [];
        normal.forEach((loc, i) => addButton(loc.label || ('Location ' + (i + 1)), 'normal', i, 'normal'));
        const houses = Array.isArray(data.houses) ? data.houses : [];
        houses.forEach(h => addButton(h.label || h.house, 'house', h.house, 'house'));
        const apartments = data.apartments && typeof data.apartments === 'object' ? data.apartments : {};
        Object.entries(apartments).forEach(([key, apt]) => addButton(apt.label || apt.name || key, 'appartment', key, null));

        if (!locationsEl.children.length) {
          messageEl.textContent = 'No spawn locations were provided. Check qb-spawn and qb-apartments configuration.';
          messageEl.style.display = 'block';
        }
      }

      confirmEl.addEventListener('click', () => {
        if (!selected) return;
        document.body.classList.remove('visible');
        if (selected.type === 'appartment') {
          post('chooseAppa', { appType: selected.name });
        } else {
          post('spawnplayer', { spawnloc: selected.name, typeLoc: selected.type });
        }
      });

      window.addEventListener('message', event => {
        const data = event.data || {};
        if (data.action === 'showUi') {
          document.body.classList.toggle('visible', !!data.status);
        } else if (data.action === 'setupAppartements') {
          isNew = !!data.isNew;
          renderLocations({ apartments: data.locations || {} });
        } else if (data.action === 'setupLocations') {
          isNew = !!data.isNew;
          renderLocations({ locations: data.locations || [], houses: data.houses || [] });
        }
      });
    })();
  </script>
</body>
</html>
